<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><style>
body { width: 1200px; height: 630px; background: #fbf5ee; font-family: Figtree, sans-serif; color: #2b1d14; overflow: hidden; position: relative; }
body::before { content: ""; position: absolute; inset: 0; background:
  radial-gradient(700px 420px at 0% -10%, rgba(255,170,110,.38), transparent 60%),
  radial-gradient(600px 400px at 105% 10%, rgba(240,96,126,.20), transparent 60%),
  radial-gradient(700px 400px at 40% 120%, rgba(247,195,95,.30), transparent 60%); }
.text { position: absolute; left: 80px; top: 92px; width: 560px; }
.brand { display: flex; align-items: center; gap: 14px; font-family: Chillax; font-weight: 600; font-size: 34px; color: #4a372b; }
.brand i { width: 26px; height: 26px; border-radius: 50%; background: var(--spec); box-shadow: 0 0 18px rgba(255,140,90,.6); }
h1 { font-family: Chillax; font-weight: 600; font-size: 92px; line-height: 1.02; letter-spacing: -.02em; margin-top: 58px; }
p { font-size: 30px; line-height: 1.35; color: #8a7466; margin-top: 26px; }
.pad { position: absolute; right: 70px; top: 80px; width: 440px; height: 470px; border-radius: 48px; box-shadow: 0 40px 90px -30px rgba(240,110,90,.7); }
</style></head><body>
<div class="text"><div class="brand"><i></i>tinytus</div><h1>Hear what I&nbsp;hear</h1><p>Recreate the sound of your tinnitus and let your loved ones hear it.</p></div>
<div class="pad"><div class="grain"></div>
  <div class="dot" style="--c:#f0803f;width:84px;height:84px;left:250px;top:78px;box-shadow:0 0 0 13px rgba(255,255,255,.32),0 16px 40px rgba(80,20,10,.35)"></div>
  <div class="dot small" style="--c:#e0507c;width:40px;height:40px;left:120px;top:250px"></div>
</div>
</body></html>
